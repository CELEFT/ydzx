<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的相册 · 自适应横竖版</title>
    <style>
        /* ---------- 全局重置 ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, system-ui, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1.5rem;
        }

        .gallery {
            max-width: 1200px;
            width: 100%;
            background: #ffffff;
            border-radius: 36px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.20);
            padding: 2.5rem 2rem;
            transition: all 0.2s ease;
        }

        .gallery-header {
            text-align: center;
            margin-bottom: 2.8rem;
        }

        .gallery-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #0f172a;
            letter-spacing: -0.02em;
        }

        .gallery-header p {
            color: #64748b;
            font-size: 1.1rem;
            margin-top: 0.3rem;
        }

        .gallery-header code {
            background: #eef2f6;
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
            font-size: 0.9rem;
            color: #334155;
        }

        /* ---------- 图片卡片容器（2列网格） ---------- */
        .photo-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        /* ---------- 卡片核心：横版 (landscape) 默认 ---------- */
        .photo-card {
            display: flex;
            flex-direction: row;          /* 横向：图片在左，文字在右 */
            align-items: stretch;
            background: #ffffff;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(226, 232, 240, 0.7);
            transition: transform 0.25s ease, box-shadow 0.3s ease;
            min-height: 200px;
        }

        .photo-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.18);
        }

        /* ----- 图片区域：强制 1:1 比例 ----- */
        .photo-card .img-wrapper {
            flex: 0 0 50%;                /* 占卡片宽度的一半 */
            max-width: 50%;
            aspect-ratio: 1 / 1;           /* 关键：强制 1:1 正方形 */
            overflow: hidden;
            background: #eef2f6;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .photo-card .img-wrapper img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;             /* 裁剪填充，保持 1:1 不变形 */
            transition: filter 0.3s ease;
            background: #eef2f6;
        }

        .photo-card:hover .img-wrapper img {
            filter: brightness(1.03) contrast(1.02);
        }

        /* ----- 文字区域（横版时在右侧） ----- */
        .photo-card .caption {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 1.8rem 2rem;
            background: #ffffff;
        }

        .photo-card .caption h3 {
            font-size: 1.3rem;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 0.25rem;
        }

        .photo-card .caption .file-name {
            font-size: 0.9rem;
            color: #94a3b8;
            font-family: 'SF Mono', 'Fira Code', monospace;
            background: #f8fafc;
            padding: 0.2rem 0.8rem;
            border-radius: 16px;
            display: inline-block;
            align-self: flex-start;
            margin-top: 0.2rem;
            border: 1px solid #f1f5f9;
        }

        .photo-card .caption .desc {
            margin-top: 0.6rem;
            font-size: 0.95rem;
            color: #475569;
            line-height: 1.5;
        }

        /* ---------- 响应式：小屏幕切换为竖版 (portrait) ---------- */
        @media (max-width: 820px) {
            .photo-grid {
                gap: 1.5rem;
            }
        }

        @media (max-width: 700px) {
            body {
                padding: 1rem;
            }

            .gallery {
                padding: 1.5rem 1rem;
                border-radius: 28px;
            }

            .gallery-header h1 {
                font-size: 1.8rem;
            }

            /* 关键：改为单列，卡片变为竖版 */
            .photo-grid {
                grid-template-columns: 1fr;
                gap: 1.8rem;
            }

            .photo-card {
                flex-direction: column;    /* 纵向：图片在上，文字在下 */
                min-height: unset;
            }

            .photo-card .img-wrapper {
                flex: 0 0 auto;
                max-width: 100%;
                width: 100%;
                aspect-ratio: 1 / 1;       /* 保持 1:1 */
            }

            .photo-card .caption {
                padding: 1.2rem 1.5rem 1.5rem;
                text-align: center;
            }

            .photo-card .caption .file-name {
                align-self: center;
            }

            .photo-card .caption .desc {
                font-size: 0.9rem;
            }
        }

        /* 极小屏适配 */
        @media (max-width: 420px) {
            .gallery-header h1 {
                font-size: 1.4rem;
            }
            .photo-card .caption {
                padding: 1rem 1.2rem 1.2rem;
            }
            .photo-card .caption h3 {
                font-size: 1.1rem;
            }
        }

        /* ---------- 页脚 ---------- */
        .footer-note {
            margin-top: 2.8rem;
            text-align: center;
            font-size: 0.85rem;
            color: #cbd5e1;
            border-top: 1px solid #f1f5f9;
            padding-top: 1.8rem;
            letter-spacing: 0.3px;
        }

        .footer-note a {
            color: #94a3b8;
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer-note a:hover {
            color: #3b82f6;
            text-decoration: underline;
        }

        /* 图片加载失败时的备用样式 */
        .photo-card .img-wrapper img::before {
            content: "📷 加载失败";
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background: #f1f5f9;
            color: #94a3b8;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="gallery">
        <!-- 头部 -->
        <div class="gallery-header">
            <h1>🖼️ 1:1 影像集</h1>
            <p>桌面横版 · 移动竖版 · 图片来自 <code>photo/</code> 文件夹</p>
        </div>

        <!-- 图片网格 -->
        <div class="photo-grid">
            <!-- 卡片 1：1.png -->
            <div class="photo-card">
                <div class="img-wrapper">
                    <img
                    src="photo/1.png"
                    alt="第一张图片"
                    loading="lazy"
                    onerror="this.style.background='#f1f5f9'; this.alt='图片加载失败，请确认 photo/1.png 存在';"
                    />
                </div>
                <div class="caption">
                    <h3>📸 映像 · 壹</h3>
                    <span class="file-name">photo/1.png</span>
                    <p class="desc">正方形构图，适配各种屏幕</p>
                </div>
            </div>

            <!-- 卡片 2：2.png -->
            <div class="photo-card">
                <div class="img-wrapper">
                    <img
                    src="photo/2.png"
                    alt="第二张图片"
                    loading="lazy"
                    onerror="this.style.background='#f1f5f9'; this.alt='图片加载失败，请确认 photo/2.png 存在';"
                    />
                </div>
                <div class="caption">
                    <h3>📸 映像 · 贰</h3>
                    <span class="file-name">photo/2.png</span>
                    <p class="desc">保持 1:1 比例，横竖切换自如</p>
                </div>
            </div>
        </div>

        <!-- 页脚 -->
        <div class="footer-note">
            <span>GitHub Pages 自适应演示 · </span>
            <a href="#" onclick="event.preventDefault();">📁 返回仓库</a>
        </div>
    </div>
</body>
</html>
